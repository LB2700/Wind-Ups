name: Continuous Integration
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm" # Caches node_modules for high-speed runs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Project Dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Run Static Analysis & Tests
        run: |
          npm run lint
          npm run check
          npm run test:unit

      - name: Start Supabase local development setup
        run: supabase db start

      - name: Reset database with migrations and seed
        run: supabase db reset

      - name: Verify schema coverage
        run: supabase db diff --strict-coverage
        
      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --local > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

      - name: Set integration test environment
        shell: bash
        run: |
          eval "$(supabase status --output env)"
          {
            echo "SITE_URL=http://localhost:4321"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      
      - name: Run integration tests
        run: npm run test:integration

      - name: Build docker image
        run: |
          docker build .